<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성균관대 CCC 순계보 — 트리뷰</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
       background: #f0f4f8; color: #2d3748; }
.hdr {
  background: linear-gradient(135deg, #1a365d, #2b6cb0);
  color: white; padding: 14px 24px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  position: sticky; top: 0; z-index: 100;
}
.hdr h1 { font-size: 1.15rem; font-weight: 700; flex: 1; }
.hdr-sub { font-size: .78rem; opacity: .72; }
.btn-hdr {
  background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.4);
  color: white; border-radius: 8px; padding: 6px 13px;
  font-size: .78rem; cursor: pointer; font-weight: 600; white-space: nowrap;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.btn-hdr:hover { background: rgba(255,255,255,.28); }
.legend {
  display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 24px;
  background: white; border-bottom: 1px solid #e2e8f0; font-size: .76rem;
  align-items: center;
}
.leg { display: flex; align-items: center; gap: 5px; }
.leg-box { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; flex-shrink: 0; }
.main { padding: 20px 24px; }
.root-section { margin-bottom: 32px; }
.root-title {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 20px;
  background: linear-gradient(90deg, #1a365d, #2b6cb0);
  color: white; font-weight: 700; font-size: .9rem;
  margin-bottom: 16px;
}
.svg-wrap {
  overflow-x: auto; overflow-y: visible;
  background: white; border-radius: 12px;
  border: 1px solid #e2e8f0;
  padding: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.btn-save {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 14px; border-radius: 16px;
  background: white; border: 1.5px solid #cbd5e0;
  color: #4a5568; font-size: .76rem; font-weight: 600;
  cursor: pointer; transition: all .15s;
}
.btn-save:hover { background: #edf2f7; border-color: #a0aec0; }
.btn-save.saving { opacity: .6; pointer-events: none; }
.tooltip {
  position: fixed; z-index: 200;
  background: white; border: 1px solid #e2e8f0;
  border-radius: 10px; padding: 10px 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  font-size: .82rem; max-width: 220px;
  pointer-events: none; opacity: 0; transition: opacity .1s;
}
.tooltip.show { opacity: 1; }
.tt-name { font-size: .95rem; font-weight: 700; margin-bottom: 5px; }
.tt-row { color: #718096; margin: 2px 0; }
.tt-row span { color: #2d3748; font-weight: 600; }
.loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 60vh; gap: 16px; color: #718096;
}
.spinner {
  width: 40px; height: 40px; border: 3px solid #e2e8f0;
  border-top-color: #4299e1; border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: #fff5f5; border: 1px solid #fed7d7; border-radius: 10px;
  padding: 20px 24px; max-width: 480px; margin: 40px auto;
  text-align: center; color: #c53030;
}
.setup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center; z-index: 999;
}
.setup-card {
  background: white; border-radius: 16px; padding: 36px 40px;
  max-width: 480px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.setup-card h2 { font-size: 1.2rem; color: #1a365d; margin-bottom: 10px; }
.setup-card p { font-size: .86rem; color: #718096; line-height: 1.6; margin-bottom: 16px; }
.url-input { width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e0;
             border-radius: 8px; font-size: .88rem; outline: none; margin-top: 10px; }
.url-input:focus { border-color: #4299e1; }
.setup-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #2b6cb0, #4299e1);
             color: white; border: none; border-radius: 10px; font-size: .95rem;
             font-weight: 700; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>

<div class="setup-overlay" id="setupOverlay" style="display:none">
  <div class="setup-card">
    <h2>⛪ 순계보 트리뷰어</h2>
    <p>메인 뷰어에서 한 번 설정하면 여기서도 자동으로 연결돼요.<br>
       아직 설정하지 않았다면 아래에 Google Sheets URL을 입력해주세요.</p>
    <input class="url-input" type="text" id="sheetUrlInput" placeholder="Google Sheets URL...">
    <div style="display:flex;gap:8px;margin-top:10px">
      <input class="url-input" type="text" id="sheet1Input" placeholder="형제 시트" style="margin-top:0;flex:1" value="형제 리스트">
      <input class="url-input" type="text" id="sheet2Input" placeholder="자매 시트" style="margin-top:0;flex:1" value="자매 리스트">
    </div>
    <button class="setup-btn" onclick="saveConfig()">연결하기</button>
  </div>
</div>

<header class="hdr">
  <div style="flex:1">
    <h1>🌳 성균관대 CCC 순계보 — 트리뷰</h1>
    <div class="hdr-sub" id="hdrSub">로딩 중...</div>
  </div>
  <button class="btn-hdr" onclick="loadData()" style="border:none">↻ 새로고침</button>
  <a class="btn-hdr" href="index.html">← 메인 뷰어</a>
</header>

<div class="legend">
  <strong style="font-size:.76rem;color:#4a5568">색상 기호:</strong>
  <div class="leg"><div class="leg-box" style="background:#dbeafe;border-color:#60a5fa"></div> 형제 순장</div>
  <div class="leg"><div class="leg-box" style="background:#fce7f3;border-color:#f9a8d4"></div> 자매 순장</div>
  <div class="leg"><div class="leg-box" style="background:#f0f9ff;border-color:#bae6fd"></div> 형제 순원</div>
  <div class="leg"><div class="leg-box" style="background:#fdf4ff;border-color:#e9d5ff"></div> 자매 순원</div>
  <span style="color:#a0aec0;margin-left:auto;font-size:.74rem">노드에 마우스를 올리면 상세 정보가 표시돼요</span>
</div>

<div class="main" id="main">
  <div class="loading"><div class="spinner"></div><span>데이터 로딩 중...</span></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const STORAGE_KEY = 'ccc_sheet_config_v2';

function loadLocal(k) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}
function saveLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function extractSheetId(url) {
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
function saveConfig() {
  const url = document.getElementById('sheetUrlInput').value.trim();
  const id = extractSheetId(url);
  if (!id) { alert('올바른 URL이 아닌 것 같아요.'); return; }
  const s1 = document.getElementById('sheet1Input').value.trim();
  const s2 = document.getElementById('sheet2Input').value.trim();
  saveLocal(STORAGE_KEY, { sheetId: id, sheets: [s1,s2].filter(Boolean) });
  document.getElementById('setupOverlay').style.display = 'none';
  loadData();
}

let memberMap = {}, childrenMap = {}, externalRoots = [], allMembers = [];

async function fetchSheet(sheetId, sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, ''));
  if (json.status === 'error') throw new Error(json.errors?.[0]?.message || '불러오기 실패');
  return json.table;
}

async function loadData() {
  const cfg = loadLocal(STORAGE_KEY);
  if (!cfg || !cfg.sheetId) { document.getElementById('setupOverlay').style.display = 'flex'; return; }
  const sheets = cfg.sheets || ['형제 리스트', '자매 리스트'];
  document.getElementById('main').innerHTML = '<div class="loading"><div class="spinner"></div><span>Google Sheets에서 불러오는 중...</span></div>';
  try {
    const results = await Promise.allSettled(sheets.map(s => fetchSheet(cfg.sheetId, s)));
    allMembers = [];
    results.forEach((r, i) => { if (r.status === 'fulfilled') parseSheet(r.value, sheets[i]); });
    if (!allMembers.length) throw new Error('데이터가 없어요.');
    build();
    render();
    document.getElementById('hdrSub').textContent = `총 ${allMembers.length}명 · ${sheets.filter((_,i)=>results[i].status==='fulfilled').join(' + ')}`;
  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="error-box">
        <p style="font-size:1.5rem;margin-bottom:8px">⚠️</p>
        <p><strong>불러오기 실패</strong></p>
        <p style="margin-top:8px;font-size:.85rem">${e.message}</p>
        <button onclick="document.getElementById('setupOverlay').style.display='flex'"
          style="margin-top:14px;padding:8px 20px;background:#2b6cb0;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600">설정 다시 하기</button>
      </div>`;
  }
}

function parseSheet(table, sheetName) {
  const autoGender = sheetName.includes('형제') ? 'M' : sheetName.includes('자매') ? 'F' : '';
  const cols = table.cols.map(c => c.label.trim());
  const idx = n => cols.indexOf(n);
  const C = {
    name: idx('이름'), parent: idx('부모 순장'), dept: idx('학과'),
    grade: idx('학년'), year: idx('학번'), phone: idx('전화번호'),
    level: idx('순원 여부'), activity: idx('활동 정도'), sabbatical: idx('휴학 여부'),
  };
  const cell = (row, ci) => {
    if (ci < 0 || !row.c || !row.c[ci]) return '';
    const v = row.c[ci].v, f = row.c[ci].f;
    return f != null ? f : (v != null ? String(v) : '');
  };
  const numVal = (row, ci) => {
    if (ci < 0 || !row.c || !row.c[ci]) return null;
    return row.c[ci].v != null ? row.c[ci].v : null;
  };
  const fmtYear = v => {
    if (v == null) return '';
    const n = typeof v === 'number' ? v : parseFloat(v);
    if (isNaN(n)) return String(v);
    const i = Math.floor(n), f = Math.round((n - i) * 10);
    return f === 0 ? String(i) : (i + '.' + f);
  };

  table.rows.forEach(row => {
    const name = cell(row, C.name).trim();
    if (!name) return;
    const cleanN = name.replace(/\d+$/, '').trim();
    const parentRaw = cell(row, C.parent).trim().replace(/\d+$/, '').trim();
    const sabbVal = (row.c && row.c[C.sabbatical]) ? row.c[C.sabbatical].v : null;
    allMembers.push({
      id: cleanN || name, rawName: name, name: cleanN || name,
      dept: cell(row, C.dept), grade: cell(row, C.grade),
      gender: autoGender,
      studentYear: fmtYear(numVal(row, C.year)),
      phone: cell(row, C.phone),
      level: cell(row, C.level) || '순원',
      activity: cell(row, C.activity),
      sabbatical: sabbVal === true || String(sabbVal).toLowerCase() === 'true',
      parent: parentRaw || null,
    });
  });
}

function build() {
  memberMap = {}; childrenMap = {}; externalRoots = [];
  const cnt = {};
  allMembers.forEach(m => { cnt[m.id] = (cnt[m.id] || 0) + 1; });
  allMembers.forEach(m => { if (cnt[m.id] > 1) { m.id = m.rawName; m.name = m.rawName; } });
  allMembers.forEach(m => { memberMap[m.id] = m; });
  const allParents = new Set();
  allMembers.forEach(m => {
    if (!m.parent) return;
    allParents.add(m.parent);
    if (!childrenMap[m.parent]) childrenMap[m.parent] = [];
    childrenMap[m.parent].push(m.id);
  });
  const mKeys = new Set(Object.keys(memberMap));
  externalRoots = [...allParents].filter(p => !mKeys.has(p)).sort();
}

// ── 트리 레이아웃 ──
const NW = 78, NH = 30, XGAP = 10, YGAP = 56;

function getKids(id) {
  return (childrenMap[id] || [])
    .filter(k => memberMap[k])
    .sort((a, b) => {
      const lo = { '순장': 0, '순원': 1 };
      return (lo[memberMap[a] && memberMap[a].level] != null ? lo[memberMap[a].level] : 2)
           - (lo[memberMap[b] && memberMap[b].level] != null ? lo[memberMap[b].level] : 2);
    });
}

function slotCount(id) {
  const kids = getKids(id);
  if (!kids.length) return 1;
  return kids.reduce((s, k) => s + slotCount(k), 0);
}

function layoutNode(id, leftSlot, depth, out) {
  const kids = getKids(id);
  const slots = slotCount(id);
  out[id] = { cx: (leftSlot + slots / 2) * (NW + XGAP), y: depth * (NH + YGAP) };
  let cur = leftSlot;
  kids.forEach(kid => {
    const ks = slotCount(kid);
    layoutNode(kid, cur, depth + 1, out);
    cur += ks;
  });
}

function nodeStyle(m) {
  if (!m) return { fill: '#f7fafc', stroke: '#e2e8f0', sw: 1, fw: 'normal' };
  if (m.level === '순장')
    return m.gender === 'F'
      ? { fill: '#fce7f3', stroke: '#f9a8d4', sw: 2, fw: 'bold' }
      : { fill: '#dbeafe', stroke: '#60a5fa', sw: 2, fw: 'bold' };
  return m.gender === 'F'
    ? { fill: '#fdf4ff', stroke: '#e9d5ff', sw: 1, fw: 'normal' }
    : { fill: '#f0f9ff', stroke: '#bae6fd', sw: 1, fw: 'normal' };
}

function buildSVG(topKids) {
  if (!topKids.length) return '<p style="color:#a0aec0;padding:20px">멤버 없음</p>';
  const positions = {};
  let left = 0;
  topKids.forEach(kid => {
    layoutNode(kid, left, 0, positions);
    left += slotCount(kid);
  });

  const allNodes = Object.values(positions);
  const xs = allNodes.map(p => p.cx);
  const ys = allNodes.map(p => p.y);
  const minCX = Math.min(...xs), maxCX = Math.max(...xs);
  const maxY = Math.max(...ys);
  const PAD = 24;
  const svgW = maxCX - minCX + NW + PAD * 2;
  const svgH = maxY + NH + PAD * 2;
  const offX = -minCX + NW / 2 + PAD;
  const offY = PAD;

  let edges = '', nodes = '';

  Object.keys(positions).forEach(id => {
    const pos = positions[id];
    const px = pos.cx + offX, py = pos.y + offY;
    getKids(id).forEach(kid => {
      if (!positions[kid]) return;
      const kpos = positions[kid];
      const ex = kpos.cx + offX, ey = kpos.y + offY;
      const startY = py + NH, midY = (startY + ey) / 2;
      edges += '<path d="M' + px + ',' + startY + ' C' + px + ',' + midY + ' ' + ex + ',' + midY + ' ' + ex + ',' + ey + '" stroke="#cbd5e0" fill="none" stroke-width="1.5" stroke-linecap="round"/>';
    });
  });

  Object.keys(positions).forEach(id => {
    const m = memberMap[id];
    if (!m) return;
    const pos = positions[id];
    const nx = pos.cx + offX - NW / 2;
    const ny = pos.y + offY;
    const s = nodeStyle(m);
    const gIcon = m.gender === 'M' ? '♂' : '♀';
    const gColor = m.gender === 'M' ? '#60a5fa' : '#f472b6';
    const displayName = m.name.length > 5 ? m.name.slice(0, 5) + '…' : m.name;
    const safeId = id.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const safeIdJs = id.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    nodes += '<g style="cursor:pointer" onmouseenter="showTip(event,\'' + safeIdJs + '\')" onmouseleave="hideTip()">'
      + '<rect x="' + nx + '" y="' + ny + '" width="' + NW + '" height="' + NH + '" rx="6" fill="' + s.fill + '" stroke="' + s.stroke + '" stroke-width="' + s.sw + '"/>'
      + '<text x="' + (nx + 9) + '" y="' + (ny + 20) + '" font-size="9" fill="' + gColor + '" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif">' + gIcon + '</text>'
      + '<text x="' + (pos.cx + offX) + '" y="' + (ny + 20) + '" text-anchor="middle" font-size="11.5" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#1a202c" font-weight="' + s.fw + '">' + displayName + '</text>'
      + '</g>';
  });

  return '<svg width="' + svgW + '" height="' + svgH + '" xmlns="http://www.w3.org/2000/svg" style="min-width:' + svgW + 'px">' + edges + nodes + '</svg>';
}

let sectionIndex = 0;
function render() {
  const main = document.getElementById('main');
  let html = '';
  sectionIndex = 0;
  externalRoots.forEach(root => {
    const kids = getKids(root);
    if (!kids.length) return;
    const sid = 'sec-' + (sectionIndex++);
    html += '<div class="root-section">'
      + '<div class="section-header">'
      + '<div class="root-title">⛪ ' + root + ' <span style="font-size:.75rem;opacity:.75">(' + kids.length + '명)</span></div>'
      + '<button class="btn-save" onclick="saveImage(\'' + sid + '\',\'' + root.replace(/'/g,"\\'") + '\')" id="savebtn-' + sid + '">📷 이미지로 저장</button>'
      + '</div>'
      + '<div class="svg-wrap" id="' + sid + '">' + buildSVG(kids) + '</div>'
      + '</div>';
  });
  const orphans = allMembers.filter(m => !m.parent).map(m => m.id);
  if (orphans.length) {
    const sid = 'sec-' + (sectionIndex++);
    html += '<div class="root-section">'
      + '<div class="section-header">'
      + '<div class="root-title" style="background:linear-gradient(90deg,#4a5568,#718096)">👤 부모 미지정 <span style="font-size:.75rem;opacity:.75">(' + orphans.length + '명)</span></div>'
      + '<button class="btn-save" onclick="saveImage(\'' + sid + '\',\'부모_미지정\')" id="savebtn-' + sid + '">📷 이미지로 저장</button>'
      + '</div>'
      + '<div class="svg-wrap" id="' + sid + '">' + buildSVG(orphans) + '</div>'
      + '</div>';
  }
  if (!html) html = '<p style="text-align:center;color:#a0aec0;padding:60px">데이터가 없어요.</p>';
  main.innerHTML = html;
}

// ── 이미지 저장 ──
function saveImage(sectionId, label) {
  const wrap = document.getElementById(sectionId);
  const btn  = document.getElementById('savebtn-' + sectionId);
  const svg  = wrap && wrap.querySelector('svg');
  if (!svg) return;

  btn.classList.add('saving');
  btn.textContent = '⏳ 저장 중...';

  const svgData = new XMLSerializer().serializeToString(svg);
  const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();

  img.onload = function() {
    const SCALE = 2; // 고해상도 (2×)
    const canvas = document.createElement('canvas');
    canvas.width  = img.width  * SCALE;
    canvas.height = img.height * SCALE;
    const ctx = canvas.getContext('2d');
    // 흰 배경
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(SCALE, SCALE);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'CCC_순계보_' + label + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      btn.classList.remove('saving');
      btn.textContent = '📷 이미지로 저장';
    }, 'image/png');
  };

  img.onerror = function() {
    // SVG에 한글 폰트가 없을 경우 대비: 직접 다운로드
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
    a.download = 'CCC_순계보_' + label + '.svg';
    a.click();
    btn.classList.remove('saving');
    btn.textContent = '📷 이미지로 저장';
  };

  img.src = url;
}

// ── 툴팁 ──
const tip = document.getElementById('tooltip');
function showTip(e, id) {
  const m = memberMap[id];
  if (!m) return;
  const kids = (childrenMap[id] || []).length;
  const nameColor = m.gender === 'M' ? '#1d4ed8' : '#be185d';
  let html = '<div class="tt-name" style="color:' + nameColor + '">' + m.name + (m.sabbatical ? ' <span style="color:#c53030;font-size:.75rem">(휴학)</span>' : '') + '</div>'
    + '<div class="tt-row">구분: <span>' + m.level + '</span></div>'
    + '<div class="tt-row">학번: <span>' + (m.studentYear || '-') + '학번</span></div>'
    + '<div class="tt-row">학과: <span>' + (m.dept || '-') + '</span></div>';
  if (m.activity) html += '<div class="tt-row">활동: <span>' + m.activity + '</span></div>';
  if (kids) html += '<div class="tt-row">순원: <span>' + kids + '명</span></div>';
  if (m.parent) html += '<div class="tt-row">부모순장: <span>' + m.parent + '</span></div>';
  tip.innerHTML = html;
  moveTip(e);
  tip.classList.add('show');
}
function moveTip(e) {
  const x = e.clientX + 14, y = e.clientY - 10;
  tip.style.left = (x + 230 > window.innerWidth ? e.clientX - 234 : x) + 'px';
  tip.style.top  = (y + 140 > window.innerHeight ? e.clientY - 144 : y) + 'px';
}
function hideTip() { tip.classList.remove('show'); }
document.addEventListener('mousemove', e => { if (tip.classList.contains('show')) moveTip(e); });

loadData();
</script>
</body>
</html>
